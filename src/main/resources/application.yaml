server:
  port: 8080

spring:
  datasource:
    url: ${DB_CONNECTION}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl_auto: update
    show-sql: true

jwt:
  signerKey: ${SIGNER_KEY}
  valid-duration: 3600
  refreshable-duration: 360000

mqtt:
  broker: ${BROKER_URL}
  clientId: smart-watering
  username: ${BROKER_USERNAME}
  password: ${BROKER_PASSWORD}