<body>
<div style="font-family: Arial, sans-serif; padding: 20px;">
    <h2>Chào bạn,</h2>

    <h1 style="color: #007bff; text-align: center; border: 1px solid #ccc; padding: 10px;" th:text="${otpCode}">
